name: CI Test Listener

on: 
  workflow_dispatch: { }
  workflow_call: { }

permissions:
  id-token: write
  pull-requests: write
  issues: write
  
jobs:
  get-context:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request != null
    outputs:
      is_ci_test: ${{ steps.info.outputs.is_ci_test }}
      base_ref: ${{ steps.info.outputs.base_ref }}
      head_ref: ${{ steps.info.outputs.head_ref }}
      head_sha: ${{ steps.info.outputs.head_sha }}
    steps:
      - name: Get PR Branch Info
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get JSON for pull request
          set -euo pipefail
          PR_JSON=$(gh pr view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --json baseRefName,headRefName,headRefOid)
          
          # Parse JSON into vars
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          
          # Ensure this was run on a ci-test branch
          IS_CI_TEST="false"
          [[ "$HEAD_REF" == ci-test/*-head ]] && IS_CI_TEST="true"
          
          echo "is_ci_test=$IS_CI_TEST" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          
  run-action:
    needs: get-context
    if: needs.get-context.outputs.is_ci_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Run Action
        uses: ./
        with:
          auto_merge: true
          post_comment: "always"
          custom_command: "/fast-forward"
  verify:
    needs: [ get-context, run-action ]
    if: always() && needs.get-context.outputs.is_ci_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Assert Action Succeeded
        if: needs.run-action.result != 'success'
        run: |
          echo "::error::run-action did not succeed (result=${{ needs.run-action.result }}. Does the Dockerfile exist?"
          
          exit 1
        
      - name: Assert Base Branch Fast-Forwarded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          # Retrieve current shas for base and head branches
          CURRENT_BASE_SHA=$(gh api "repos/${{ github.repository }}/git/refs/heads/
            ${{ needs.get-context.outputs.base_ref }}" --jq '.object.sha')
          EXPECTED_SHA="${{ needs.get-context.outputs.head_sha }}"
          
          # Check if the fast-forward failed
          if [[ "$CURRENT_BASE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Base branch ${{ needs.get-context.outputs.base_ref }} is at $CURRENT_BASE_SHA, expected
              $EXPECTED_SHA. Fast-forward did not occur. Is EventInfo.IsPossible correctly wired?"
          
            exit 1
          fi
          
          echo "Fast-forward confimred: base branch is now at $CURRENT_BASE_SHA."
          
      - name: Assert Comment Posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          # Get comment count on PR. Since this is automated, there should only be 2 comments.
          COUNT=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" --jq 'length')
          if [[ "$COUNT" -lt 2 ]]; then
            echo "::error::Expected at least 2 comments (the command + result), found $COUNT. Check the
              INPUT_POST_COMMENT environment variable. Is Program.cs's unconditional PostComment call wired correctly?"
          
            exit 1
          fi
          
          echo "Found $COUNT comments on the PR."
          
  cleanup:
    needs: [ get-context, verify ]
    if: always() && needs.get-context.outputs.is_ci_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR and Delete Scenario Branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            --delete "${{ needs.get-context.outputs.head_ref }}" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            --delete "${{ needs.get-context.outputs.base_ref }}" || true
