on:
  workflow_dispatch: { }
  pull_request:
    types:
      - opened
  issue_comment:
    types:
      - created
      - edited

permissions:
  id-token: write

jobs:
  gather-context:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request != null
    outputs:
      is_self_test: ${{ steps.info.outputs.is_self_test }}
      base_ref: ${{ steps.info.outputs.base_ref }}
      head_ref: ${{ steps.info.outputs.head_ref }}
      head_sha: ${{ steps.info.outputs.head_sha }}
    steps:
      - name: Lookup PR Branch Info
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --json baseRefName,headRefName,headRefOid)
          
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          
          IS_SELF_TEST="false"
          [[ "$HEAD_REF" == self-test/*-head ]] && IS_SELF_TEST="true"
          
          echo "is_self_test=$IS_SELF_TEST" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  run-action:
    needs: gather-context
    if: needs.gather-context.outputs.is_self_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Run Action
        uses: ../
        with:
          auto_merge: true
          post_comment: "always"
          custom_command: "/fast-forward"
    
  verify:
    needs: [gather-context, run-action]
    if: always() && needs.gather-context.outputs.is_self_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Assert the action step itself succeeded
        if: needs.run-action.result != 'success'
        run: |
          echo "::error::run-action did not succeed (result=${{ needs.run-action.result }}. This usually means the 
          Docker image failed to build. Check that action.yml's 'image:' path actually points at an existing Dockerfile."
          
          exit 1
      - name: Assert Base Branch Was Fast-Forwarded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_BASE_SHA=$(gh api "repos/${{ github.repository }}/git/refs/heads/
          ${{ needs.gather-context.outputs.base_ref }}" --jq '.object.sha')
          EXPECTED_SHA="${{ needs.gather-context.outputs.head_sha }}"
          
          if [[ "$CURRENT_BASE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Base branch ${{ needs.gather-context.outputs.base_ref }} is at $CURRENT_BASE_SHA, expected 
            $EXPECTED_SHA. Fast-forward did not occur. Make sure EventInfo.IsPossible is correctly wired."
            
            exit 1
          fi
          
          echo "Fast-forward confirmed: base branch is now at $CURRENT_BASE_SHA"
          
      - name: Assert a Comment Was Posted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" --jq 'length')
          if [[ "$COUNT" -lt 2 ]]; then
            echo "::error::Expected at least 2 comments (the command + result comments), found $COUNT. Check the 
            INPUT_POST_COMMENT env var name and Program.cs's unconditional PostComment call."
            
            exit 1
          fi
          
          echo "Found $COUNT comments on the PR."
          
  cleanup:
    needs: [ gather-context, verify ]
    if: always() && needs.gather-contet.outputs.is_self_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR and Delete Scenario Branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" || true
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            --delete "${{ needs.gather-context.outputs.head_ref }}" || true
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            --delete "${{ needs.gather-context.outputs.base_ref }}" || true